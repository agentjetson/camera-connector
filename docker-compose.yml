# Local / edge bring-up for camera-connector
# Mirrors the style used by alpr-consumer + core specialists.

services:
  camera-connector:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # Pass source as command override, e.g.:
    #   command: ["/app/camera_connector", "--publish", "/app/sample.mp4"]
    #   command: ["/app/camera_connector", "--ingest", "0"]
    #   command: ["/app/camera_connector", "--publish", "--ingest", "rtsp://user:pass@cam/stream"]
    #   command: ["/app/camera_connector", "/dev/video0", "1280", "720"]
    #   command: ["/app/camera_connector", "/media/sample.mp4"]
    command: ["/app/camera_connector", "0"]
    # Host network so object-classifier / object-storage on the same host are reachable
    network_mode: host
    environment:
      FRAME_GRPC_ADDR: "0.0.0.0:50060"
      FRAME_ENCODING: jpeg
      FRAME_JPEG_QUALITY: "80"
      # Ingest → core object-storage (RustFS-backed)
      # INGEST: "true"
      # OBJECT_STORAGE_HTTP: "http://127.0.0.1:8081"
      # INGEST_SEGMENT_SEC: "30"
      # INGEST_SOURCE: "cam-0"
      SPDLOG_LEVEL: info
    # Host camera access (V4L2)
    devices:
      - /dev/video0:/dev/video0
    # Optional: privileged if your host needs broader device access
    # privileged: true
    # Optional sample / media mount
    # volumes:
    #   - ./sample.mp4:/app/sample.mp4:ro
    restart: unless-stopped
